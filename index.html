<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#ff008c">
<meta name="description" content="AXA Records — a very unofficial archive.">

<title>AXA RECORDS™</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;600;700&display=swap');

:root {
    --pink: #ff1493;
    --hotpink: #ff008c;
    --pink2: #ff72c5;
    --lightpink: #ffb6e6;
    --baby: #ffd9f3;
    --white: #fffaff;
    --black: #160012;
    --grey: #cfcfcf;

    --chrome: linear-gradient(
        135deg,
        #ffffff 0%,
        #cfcfcf 18%,
        #ffffff 35%,
        #8e8e8e 48%,
        #ffffff 63%,
        #bdbdbd 80%,
        #ffffff 100%
    );
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.8) 0 1px, transparent 2px),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,.7) 0 1px, transparent 2px),
        linear-gradient(135deg, #ff73c7, #ff009d 45%, #8c0057);
    background-size: 45px 45px, 70px 70px, 100% 100%;
    color: var(--black);
    font-family: "Space Grotesk", sans-serif;
}

button,
a {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================================
   TOP BAR
========================================= */

.topbar {
    height: 34px;
    position: sticky;
    top: 0;
    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 14px;

    background: #111;
    color: #ff8dd7;

    border-bottom: 2px solid white;

    font-family: "DM Mono", monospace;
    font-size: 10px;
    letter-spacing: 1px;
}

.topbar-status {
    display: flex;
    align-items: center;
    gap: 7px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff1493;
    box-shadow: 0 0 8px #ff1493;
}

.blink {
    animation: blink 1.2s steps(2) infinite;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}

/* =========================================
   MAIN WINDOW
========================================= */

.site-window {
    width: min(1180px, 94%);
    margin: 24px auto 60px;

    background: rgba(255, 211, 241, .95);

    border: 3px solid white;

    box-shadow:
        0 0 0 3px #ff008c,
        0 20px 70px rgba(60, 0, 40, .5);
}

/* =========================================
   WINDOW HEADER
========================================= */

.window-header {
    min-height: 34px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 7px 10px;

    background: var(--chrome);

    border-bottom: 3px solid #222;

    font-family: "DM Mono", monospace;
    font-size: 10px;
}

.window-title {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.window-buttons {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
}

.window-buttons span {
    width: 16px;
    height: 16px;

    display: grid;
    place-items: center;

    background: #ff1493;
    color: white;

    border: 1px solid #111;

    font-size: 10px;
}

/* =========================================
   HERO
========================================= */

.hero {
    position: relative;
    overflow: hidden;

    padding: 58px 20px 42px;

    text-align: center;

    background:
        radial-gradient(circle at center, rgba(255,255,255,.75), transparent 31%),
        linear-gradient(135deg, #ffb3e5, #ff159b);

    border-bottom: 3px solid #111;
}

.hero::before {
    content: "✦  ✧  ✦  ✧  ✦  ✧  ✦";

    position: absolute;
    top: 12px;
    left: 0;

    width: 100%;

    color: white;
    font-size: 20px;
    letter-spacing: 11px;
    opacity: .65;
}

.hero::after {
    content: "";

    position: absolute;
    width: 350px;
    height: 350px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border: 1px solid rgba(255,255,255,.3);
    border-radius: 50%;

    box-shadow:
        0 0 0 25px rgba(255,255,255,.05),
        0 0 0 55px rgba(255,255,255,.04),
        0 0 0 90px rgba(255,255,255,.03);

    pointer-events: none;
}

.logo {
    position: relative;
    z-index: 2;

    margin: 24px 0;

    color: white;

    font-family: "Archivo Black", sans-serif;
    font-size: clamp(44px, 9vw, 105px);
    line-height: .82;

    text-shadow:
        3px 3px 0 #ff008c,
        6px 6px 0 #a50064,
        0 0 20px white;

    transform: skew(-5deg);
}

.subtitle {
    position: relative;
    z-index: 2;

    display: inline-block;

    padding: 7px 13px;

    background: #111;
    color: #ff9bdd;

    border: 2px solid white;

    font-family: "DM Mono", monospace;
    font-size: 10px;
    letter-spacing: 2px;
}

.hero-copy {
    position: relative;
    z-index: 2;

    max-width: 590px;

    margin: 20px auto 0;

    font-size: 14px;
    line-height: 1.6;
}

/* =========================================
   NAV
========================================= */

.nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 7px;

    padding: 14px;

    background: #ff78c8;

    border-bottom: 3px solid #111;
}

.nav a {
    padding: 8px 16px;

    color: white;
    background: #111;

    border: 2px solid white;

    box-shadow: 3px 3px 0 #ff008c;

    text-decoration: none;

    font-family: "DM Mono", monospace;
    font-size: 10px;

    transition: transform .15s, box-shadow .15s;
}

.nav a:hover,
.nav a:focus-visible {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 #ff008c;
}

/* =========================================
   PLAYER
========================================= */

.player {
    margin: 25px;

    padding: 12px;

    background: #111;
    color: #ff94d6;

    border: 3px solid white;

    box-shadow: 7px 7px 0 #ff008c;

    font-family: "DM Mono", monospace;
    font-size: 10px;
}

.player-inner {
    display: flex;
    align-items: center;
    gap: 12px;
}

.equalizer {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 22px;
}

.equalizer span {
    width: 4px;
    height: 6px;
    display: block;
    background: #ff1493;
    animation: eq .7s infinite alternate;
}

.equalizer span:nth-child(2) {
    animation-delay: .15s;
}

.equalizer span:nth-child(3) {
    animation-delay: .3s;
}

.equalizer span:nth-child(4) {
    animation-delay: .1s;
}

@keyframes eq {
    from { height: 4px; }
    to { height: 22px; }
}

.equalizer.paused span {
    animation-play-state: paused;
    height: 4px;
}

.player-info {
    flex: 1;
}

.player-info strong {
    color: white;
}

.player-time {
    white-space: nowrap;
}

.audio-button {
    padding: 7px 10px;

    background: #ff008c;
    color: white;

    border: 2px solid white;

    font-family: "DM Mono", monospace;
    font-size: 10px;
    font-weight: 500;
}

.audio-button:hover {
    background: white;
    color: #111;
}

/* =========================================
   SECTIONS
========================================= */

.section {
    padding: 38px 25px;

    background:
        linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.35) 1px, transparent 1px),
        #ff9edb;

    background-size: 20px 20px;
}

.section-title {
    margin: 0 0 8px;

    color: white;

    font-family: "Archivo Black", sans-serif;
    font-size: clamp(30px, 5vw, 55px);

    text-shadow: 3px 3px #ff008c;
}

.section-intro {
    margin-bottom: 35px;

    font-family: "DM Mono", monospace;
    font-size: 10px;
}

/* =========================================
   RECORDS
========================================= */

.record-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 35px;
}

.record {
    position: relative;
    min-height: 300px;

    cursor: pointer;

    perspective: 1000px;
}

.record:focus-visible {
    outline: 3px solid white;
    outline-offset: 5px;
}

.cd {
    width: min(235px, 80vw);
    aspect-ratio: 1;

    margin: auto;

    position: relative;

    border-radius: 50%;
    border: 8px solid #111;

    background:
        repeating-radial-gradient(
            circle,
            #222 0px,
            #333 2px,
            #111 4px,
            #444 5px
        );

    box-shadow:
        0 12px 15px rgba(80,0,50,.4),
        inset 0 0 30px #000;

    transition:
        transform .5s cubic-bezier(.2,.8,.2,1),
        filter .2s;
}

.record:hover .cd,
.record:focus-visible .cd {
    transform: translateY(-15px) rotate(12deg) scale(1.04);
    filter: brightness(1.08);
}

.cd::before {
    content: "";

    position: absolute;
    inset: 25%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff 0 3%,
            #111 4% 6%,
            var(--pink) 7% 60%,
            #ff8bd5 61% 100%
        );

    border: 4px solid #111;
}

.cd::after {
    content: "";

    position: absolute;

    width: 12px;
    height: 12px;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    background: white;

    border: 3px solid #111;
    border-radius: 50%;
}

.record-number {
    position: absolute;
    z-index: 3;

    top: 5px;
    left: 5px;

    padding: 5px 8px;

    background: white;

    border: 2px solid #111;

    font-family: "DM Mono", monospace;
    font-size: 10px;
}

.record-label {
    margin-top: 12px;
    text-align: center;
}

.record-label h3 {
    margin: 0;

    font-family: "Archivo Black", sans-serif;
    font-size: 17px;
}

.record-label p {
    min-height: 13px;

    margin: 5px 0;

    font-family: "DM Mono", monospace;
    font-size: 9px;
    letter-spacing: .4px;
}

/* =========================================
   B SIDES
========================================= */

.b-sides {
    padding: 42px 25px;

    background: #111;
    color: white;
}

.b-sides .section-title {
    color: #ff8bd5;
}

.b-sides .section-intro {
    color: #ffb6e6;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.product {
    padding: 18px;

    color: #111;
    background: var(--chrome);

    border: 3px solid white;

    box-shadow: 6px 6px #ff008c;

    transition: transform .2s;
}

.product:hover {
    transform: rotate(-1.5deg) translateY(-5px);
}

.product-image {
    height: 160px;

    display: grid;
    place-items: center;

    margin-bottom: 15px;

    background:
        radial-gradient(circle at 40% 40%, white, transparent 5%),
        linear-gradient(135deg,#ff8bd5,#ff008c);

    border: 2px solid #111;

    font-size: 55px;
}

.product h3 {
    margin: 0 0 8px;

    font-family: "Archivo Black", sans-serif;
}

.product p {
    margin: 0;

    font-family: "DM Mono", monospace;
    font-size: 9px;
    line-height: 1.7;
}

/* =========================================
   ARCHIVE / LETTER
========================================= */

.archive-section {
    padding: 42px 25px;

    background: #ffd9f1;

    border-top: 3px solid #111;
}

.letter {
    max-width: 800px;

    margin: auto;
    padding: clamp(22px, 5vw, 45px);

    background: rgba(255,255,255,.62);

    border: 3px solid #111;

    box-shadow: 8px 8px 0 #ff008c;
}

.letter-label {
    margin-bottom: 20px;

    color: #ff008c;

    font-family: "DM Mono", monospace;
    font-size: 10px;
    letter-spacing: 1px;
}

.letter h2 {
    margin: 0 0 25px;

    font-family: "Archivo Black", sans-serif;
    font-size: clamp(28px, 5vw, 52px);
}

.letter p {
    margin: 0 0 18px;

    font-size: 15px;
    line-height: 1.75;
}

.letter .signoff {
    margin-top: 30px;

    font-family: "DM Mono", monospace;
    font-size: 11px;
}

/* =========================================
   PLAYLIST
========================================= */

.playlist-section {
    padding: 40px 25px;

    background:
        linear-gradient(135deg, #ff1493, #a60068);

    color: white;
}

.playlist-card {
    max-width: 760px;

    margin: auto;
    padding: 25px;

    background: #111;

    border: 3px solid white;

    box-shadow: 8px 8px 0 #ffb6e6;
}

.playlist-card h2 {
    margin: 0 0 10px;

    font-family: "Archivo Black", sans-serif;
    font-size: clamp(25px, 5vw, 45px);
    color: #ff8bd5;
}

.playlist-card p {
    margin: 0 0 20px;

    color: #ddd;

    font-size: 13px;
    line-height: 1.6;
}

.playlist-link {
    display: inline-block;

    padding: 11px 15px;

    background: #ff008c;
    color: white;

    border: 2px solid white;

    text-decoration: none;

    font-family: "DM Mono", monospace;
    font-size: 10px;
}

.playlist-link:hover {
    background: white;
    color: #111;
}

/* =========================================
   FOOTER
========================================= */

footer {
    padding: 25px;

    background: #ff008c;
    color: white;

    border-top: 3px solid white;

    text-align: center;

    font-family: "DM Mono", monospace;
    font-size: 9px;
    line-height: 1.7;
}

/* =========================================
   MODAL
========================================= */

.modal {
    position: fixed;
    inset: 0;
    z-index: 2000;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(25,0,18,.78);

    backdrop-filter: blur(8px);
}

.modal.active {
    display: flex;
    animation: fadeIn .2s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.modal-card {
    width: min(700px, 95vw);
    max-height: 90vh;

    overflow-y: auto;

    background: #ffd9f1;

    border: 4px solid white;

    box-shadow:
        0 0 0 4px #ff008c,
        15px 15px 0 #111,
        0 0 70px #ff00a6;

    animation: openRecord .45s cubic-bezier(.2,.8,.2,1);
}

@keyframes openRecord {
    from {
        transform: translateY(100px) rotate(7deg) scale(.7);
        opacity: 0;
    }

    to {
        transform: translateY(0) rotate(0) scale(1);
        opacity: 1;
    }
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 8px;

    background: var(--chrome);

    border-bottom: 3px solid #111;

    font-family: "DM Mono", monospace;
    font-size: 10px;
}

.close {
    padding: 2px 8px;

    background: #ff008c;
    color: white;

    border: 2px solid #111;

    font-weight: bold;
}

.close:hover {
    background: #111;
}

.modal-content {
    padding: 35px;
}

.big-number {
    color: #ff008c;

    font-family: "Archivo Black", sans-serif;
    font-size: 65px;
    line-height: 1;
}

.modal-content h2 {
    margin: 10px 0 25px;

    color: #111;

    font-family: "Archivo Black", sans-serif;
    font-size: clamp(30px, 6vw, 55px);
    line-height: .95;
}

.info-box {
    margin: 12px 0;
    padding: 15px;

    background: rgba(255,255,255,.58);

    border: 2px solid #111;
}

.info-box strong {
    display: block;

    margin-bottom: 6px;

    color: #ff008c;

    font-family: "DM Mono", monospace;
    font-size: 9px;
    letter-spacing: 1px;
}

.info-box p {
    margin: 0;

    font-size: 14px;
    line-height: 1.6;
}

.memory-note {
    font-family: "DM Mono", monospace !important;
    font-size: 12px !important;
    line-height: 1.75 !important;
}

.quote {
    margin: 0;

    color: #ff008c;

    font-family: "Archivo Black", sans-serif;
    font-size: clamp(22px, 4vw, 34px);
    line-height: 1.1;
}

.photo-frame {
    overflow: hidden;

    margin-top: 15px;

    background: #111;

    border: 3px solid #111;
}

.photo-frame img {
    display: block;

    width: 100%;
    max-height: 500px;

    object-fit: cover;
}

.play-button {
    display: inline-block;

    margin-top: 15px;
    padding: 12px 18px;

    background: #111;
    color: #ff8bd5;

    border: 2px solid white;

    box-shadow: 4px 4px #ff008c;

    text-decoration: none;

    font-family: "DM Mono", monospace;
    font-size: 10px;
}

.play-button:hover {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px #ff008c;
}

.future-grid {
    display: grid;
    gap: 12px;
}

.future-item {
    padding: 13px;

    background: white;

    border-left: 5px solid #ff008c;
}

.future-item strong {
    color: #ff008c;

    font-family: "DM Mono", monospace;
    font-size: 9px;
}

.future-item p {
    margin: 5px 0 0;
}

/* =========================================
   REDUCED MOTION
========================================= */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 800px) {
    .record-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }

    .product-grid {
        grid-template-columns: 1fr 1fr;
    }

    .player-inner {
        flex-wrap: wrap;
    }

    .player-time {
        display: none;
    }

    .audio-button {
        margin-left: auto;
    }
}

@media (max-width: 520px) {
    .record-grid,
    .product-grid {
        grid-template-columns: 1fr;
    }

    .site-window {
        width: 96%;
        margin-top: 10px;
    }

    .hero {
        padding-top: 45px;
    }

    .cd {
        width: 210px;
    }

    .player {
        margin: 18px;
    }

    .modal {
        padding: 10px;
    }

    .modal-card {
        max-height: 94vh;
    }

    .modal-content {
        padding: 23px;
    }
}
</style>
</head>

<body>

<!-- =========================================
     TOP BAR
========================================= -->

<div class="topbar">
    <span>AXA™ RECORDS</span>

    <span class="topbar-status">
        <span class="status-dot"></span>
        <span class="blink">ARCHIVE ONLINE</span>
    </span>
</div>


<!-- =========================================
     SITE
========================================= -->

<main class="site-window">

    <div class="window-header">
        <span class="window-title">
            AXA RECORDS — VERY LIMITED EDITION
        </span>

        <div class="window-buttons" aria-hidden="true">
            <span>_</span>
            <span>□</span>
            <span>×</span>
        </div>
    </div>


    <!-- =====================================
         HERO
    ====================================== -->

    <header class="hero">

        <div class="logo">
            AXA™<br>RECORDS
        </div>

        <div class="subtitle">
            OFFICIAL UNOFFICIAL DIGITAL RECORD STORE
        </div>

        <p class="hero-copy">
            A small and unnecessarily elaborate archive of songs,
            memories, questionable decisions, and one very specific
            friendship.
        </p>

    </header>


    <!-- =====================================
         NAV
    ====================================== -->

    <nav class="nav" aria-label="Main navigation">
        <a href="#records">RECORDS</a>
        <a href="#bsides">B-SIDES</a>
        <a href="#archive">
